name: Tests

# Runs the test suite on pushes to main and on every pull request, so map /
# pipeline changes are validated before they reach the Pi.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # pytest is a dev-only dependency, so it's installed here rather than
        # in requirements.txt (which is what runs on the Pi).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -q
